<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            /* border: 2px solid red; */
            position: relative;
            padding: 10px;
        }

        .avatar {
            border-radius: 50%;
            box-shadow: 5px 5px 8px gray;
        }

        .online {
            width: 40px;
            height: 40px;
            background-color: green;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="avatar" src="https://i.pravatar.cc/100?img=4" alt="avatar">
        <div class="online"></div>
    </div>
</body>
</html>
